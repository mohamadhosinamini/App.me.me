name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev zlib1g-dev openjdk-17-jdk
          pip install --upgrade buildozer cython kivy

      - name: Auto-accept Android SDK Licenses & Build APK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer -v android debug <<EOF
          y
          EOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldLotAI-APK
          path: bin/*.apk
